<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><title>default_wallpaper</title><link rel="stylesheet" href="ui.css"></head><body>
<header>default_wallpaper</header><main>
<section class="field"><label for="interval">INTERVAL</label><div class="selector"><select id="interval"><option value="0">MANUAL</option><option value="1">1 MIN</option><option value="5">5 MIN</option><option value="15">15 MIN</option><option value="30">30 MIN</option><option value="60">1 H</option><option value="120">2 H</option><option value="360">6 H</option><option value="720">12 H</option><option value="1440">24 H</option></select></div></section>
<section class="field photos"><label for="source">PHOTOS</label><div><div class="row"><div class="selector grow"><select id="source"><option value="system">PICTURES</option><option value="folder">FOLDER</option><option value="none">NONE</option></select></div><button id="connect" hidden>CONNECT</button><button id="choose-photo" title="Choose photo folder" aria-label="Choose photo folder">…</button></div><p id="photo-path" class="path" hidden></p></div></section>
<section class="field"><label for="choose-save">SAVE TO</label><button id="choose-save" title="Choose export folder"><span id="save-path" class="path"></span><span aria-hidden="true">…</span></button></section>
<section class="field"><label for="buttons">DESKTOP</label><label class="toggle"><input type="checkbox" id="buttons" aria-label="Show desktop buttons"><span id="button-state">OFF</span></label></section>
<section class="field"><label for="shortcut">SHORTCUT</label><div class="row"><input id="shortcut" readonly placeholder="RECORD" aria-label="Record generation shortcut"><button id="clear-shortcut">CLEAR</button></div></section>
</main><p id="status" role="status" hidden></p><script src="native-bridge.js"></script><script src="settings.js"></script></body></html>
